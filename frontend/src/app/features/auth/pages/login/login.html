<div class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
  <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-xl">
    <div class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-slate-900">Welcome Back</h1>
      <p class="mt-2 text-sm text-slate-500">
        Sign in to continue to the Dialysis Center Platform.
      </p>
    </div>

    <form class="space-y-5">
      <div class="flex flex-col gap-2">
        <label class="text-sm font-medium text-slate-700">Email</label>
        <input
          type="email"
          placeholder="john@example.com"
          class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 outline-none transition focus:border-blue-600 focus:ring-2 focus:ring-blue-200"
        />
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-sm font-medium text-slate-700">Password</label>
        <input
          type="password"
          placeholder="••••••••"
          class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 outline-none transition focus:border-blue-600 focus:ring-2 focus:ring-blue-200"
        />
      </div>

      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2 text-slate-600 cursor-pointer">
          <input type="checkbox" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500" />
          <span>Remember me</span>
        </label>

        <a href="#" class="text-blue-600 hover:text-blue-700 transition">Forgot Password?</a>
      </div>

      <button
        type="submit"
        class="w-full rounded-lg bg-blue-600 py-3 font-semibold text-white transition hover:bg-blue-700 active:scale-[0.99]"
      >
        Login
      </button>
    </form>
  </div>
</div>
