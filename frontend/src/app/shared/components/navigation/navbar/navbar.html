<!-- src/app/shared/components/navigation/navbar/navbar.html -->

<header
  class="sticky top-0 z-50 bg-white shadow-[inset_0_1px_0_0_rgba(255,255,255,0.9),0_14px_28px_-10px_rgba(15,23,42,0.22),0_3px_8px_-2px_rgba(15,23,42,0.12)] dark:bg-slate-900 dark:shadow-[inset_0_1px_0_0_rgba(255,255,255,0.05),0_14px_28px_-10px_rgba(0,0,0,0.65),0_3px_8px_-2px_rgba(0,0,0,0.45)]"
>
  <nav
    class="relative mx-auto flex h-16 max-w-7xl items-center justify-between gap-4 px-4 sm:px-6 lg:px-8"
  >
    <span
      class="pointer-events-none absolute inset-x-0 -bottom-px h-0.5 bg-gradient-to-r from-blue-600/0 via-blue-500 to-blue-600/0"
      aria-hidden="true"
    ></span>

    <a
      routerLink="/dashboard"
      class="flex shrink-0 items-center gap-2.5 rounded-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-slate-900"
    >
      <span
        class="flex h-9 w-9 items-center justify-center rounded-lg bg-blue-600 shadow-[inset_0_1px_0_0_rgba(255,255,255,0.35),0_4px_10px_-2px_rgba(37,99,235,0.55)]"
      >
        <svg viewBox="0 0 24 24" fill="none" class="h-5 w-5" aria-hidden="true">
          <path
            d="M2 12h4l2-6 3 12 2.5-9L15 12h7"
            stroke="white"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
      <span class="flex flex-col leading-none">
        <span class="text-base font-semibold tracking-tight text-slate-900 dark:text-white"
          >Nephron</span
        >
        <span class="text-[11px] font-medium text-slate-400 dark:text-slate-500"
          >Dialysis Center Platform</span
        >
      </span>
    </a>

    <ul class="hidden items-center gap-1 lg:flex">
      @for (item of navItems; track item.path) {
        <li>
          <a
            [routerLink]="item.path"
            routerLinkActive="text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-500/10"
            [routerLinkActiveOptions]="{ exact: false }"
            class="rounded-md px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white"
          >
            {{ item.label }}
          </a>
        </li>
      }
    </ul>

    <div class="flex items-center gap-1.5 sm:gap-2">
      <div
        class="hidden items-center gap-2 rounded-full border border-slate-200 bg-slate-50 py-1.5 pl-2 pr-3 shadow-sm md:flex dark:border-slate-800 dark:bg-slate-800/60"
        title="All systems normal"
      >
        <span class="relative flex h-2 w-2">
          <span
            class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-75 motion-reduce:animate-none"
          ></span>
          <span class="relative inline-flex h-2 w-2 rounded-full bg-emerald-500"></span>
        </span>
        <span class="text-xs font-medium text-slate-500 dark:text-slate-400"
          >All systems normal</span
        >
      </div>

      <button
        type="button"
        aria-label="Search"
        class="rounded-md p-2 text-slate-500 transition hover:bg-slate-100 hover:text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-white"
      >
        <svg viewBox="0 0 24 24" fill="none" class="h-5 w-5" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
          <path d="m21 21-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>

      <button
        type="button"
        aria-label="Notifications"
        class="relative rounded-md p-2 text-slate-500 transition hover:bg-slate-100 hover:text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-white"
      >
        <svg viewBox="0 0 24 24" fill="none" class="h-5 w-5" aria-hidden="true">
          <path
            d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M13.73 21a2 2 0 0 1-3.46 0"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        <span
          class="absolute right-1.5 top-1.5 h-2 w-2 rounded-full bg-red-500 ring-2 ring-white dark:ring-slate-900"
        ></span>
      </button>

      <button
        type="button"
        (click)="toggleTheme()"
        [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
        class="rounded-md p-2 text-slate-500 transition hover:bg-slate-100 hover:text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-white"
      >
        @if (isDark()) {
          <svg viewBox="0 0 24 24" fill="none" class="h-5 w-5" aria-hidden="true">
            <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2" />
            <path
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" class="h-5 w-5" aria-hidden="true">
            <path
              d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linejoin="round"
            />
          </svg>
        }
      </button>

      <span class="mx-1 hidden h-6 w-px bg-slate-200 sm:block dark:bg-slate-800"></span>

      <button
        type="button"
        class="flex items-center gap-2 rounded-full py-1 pl-1 pr-2 transition hover:bg-slate-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 dark:hover:bg-slate-800"
      >
        <span
          class="flex h-8 w-8 items-center justify-center rounded-full bg-slate-200 text-xs font-semibold text-slate-700 shadow-inner dark:bg-slate-700 dark:text-slate-200"
        >
          JD
        </span>
        <svg
          viewBox="0 0 24 24"
          fill="none"
          class="hidden h-4 w-4 text-slate-400 sm:block"
          aria-hidden="true"
        >
          <path
            d="m6 9 6 6 6-6"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>

      <button
        type="button"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="mobileOpen()"
        aria-label="Toggle menu"
        class="ml-1 rounded-md p-2 text-slate-500 transition hover:bg-slate-100 hover:text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 lg:hidden dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-white"
      >
        @if (mobileOpen()) {
          <svg viewBox="0 0 24 24" fill="none" class="h-5 w-5" aria-hidden="true">
            <path
              d="M6 6l12 12M18 6 6 18"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" class="h-5 w-5" aria-hidden="true">
            <path
              d="M4 7h16M4 12h16M4 17h16"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        }
      </button>
    </div>
  </nav>

  @if (mobileOpen()) {
    <div
      class="border-t border-slate-200 bg-white px-4 pb-4 pt-2 shadow-[0_14px_28px_-10px_rgba(15,23,42,0.22)] lg:hidden dark:border-slate-800 dark:bg-slate-900"
    >
      <ul class="flex flex-col gap-1">
        @for (item of navItems; track item.path) {
          <li>
            <a
              [routerLink]="item.path"
              routerLinkActive="text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-500/10"
              (click)="closeMobileMenu()"
              class="block rounded-md px-3 py-2.5 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
      <div
        class="mt-3 flex items-center gap-2 rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 dark:border-slate-800 dark:bg-slate-800/60"
      >
        <span class="relative flex h-2 w-2">
          <span
            class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-75 motion-reduce:animate-none"
          ></span>
          <span class="relative inline-flex h-2 w-2 rounded-full bg-emerald-500"></span>
        </span>
        <span class="text-xs font-medium text-slate-500 dark:text-slate-400"
          >All systems normal</span
        >
      </div>
    </div>
  }
</header>
